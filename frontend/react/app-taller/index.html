<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Gestión</title>
    <style>
      /* ── Splash Loader (se muestra mientras React + Backend cargan) ── */
      body {
        margin: 0;
        padding: 0;
        background: #0f1724;
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
      }

      .splash-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        background: linear-gradient(
          145deg,
          #0f1724 0%,
          #162033 50%,
          #1a2742 100%
        );
        user-select: none;
      }

      /* Logo / Icono */
      .splash-logo {
        width: 80px;
        height: 80px;
        border-radius: 20px;
        background: linear-gradient(135deg, #3b82f6, #6366f1);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 2rem;
        box-shadow: 0 8px 32px rgba(59, 130, 246, 0.35);
        animation: logoPulse 2s ease-in-out infinite;
      }

      .splash-logo svg {
        width: 44px;
        height: 44px;
        fill: none;
        stroke: #fff;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      @keyframes logoPulse {
        0%,
        100% {
          transform: scale(1);
          box-shadow: 0 8px 32px rgba(59, 130, 246, 0.35);
        }
        50% {
          transform: scale(1.05);
          box-shadow: 0 12px 48px rgba(99, 102, 241, 0.5);
        }
      }

      /* Spinner ring */
      .splash-spinner {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(255, 255, 255, 0.08);
        border-top-color: #3b82f6;
        border-right-color: #6366f1;
        border-radius: 50%;
        animation: spinRing 1s linear infinite;
        margin-bottom: 1.5rem;
      }

      @keyframes spinRing {
        to {
          transform: rotate(360deg);
        }
      }

      /* Texto */
      .splash-title {
        font-size: 1.35rem;
        font-weight: 700;
        color: #e2e8f0;
        letter-spacing: 0.5px;
        margin-bottom: 0.35rem;
      }

      .splash-subtitle {
        font-size: 0.85rem;
        color: #64748b;
        letter-spacing: 0.3px;
      }

      /* Dots animados */
      .splash-dots {
        display: inline-flex;
        gap: 4px;
        margin-left: 2px;
      }

      .splash-dots span {
        display: inline-block;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #64748b;
        animation: dotBounce 1.4s ease-in-out infinite;
      }

      .splash-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .splash-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes dotBounce {
        0%,
        80%,
        100% {
          opacity: 0.3;
          transform: scale(0.8);
        }
        40% {
          opacity: 1;
          transform: scale(1.2);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Splash Loader: se reemplaza automáticamente cuando React se monta -->
      <div class="splash-loader">
        <div class="splash-logo">
          <svg viewBox="0 0 24 24">
            <path
              d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
            />
          </svg>
        </div>
        <div class="splash-spinner"></div>
        <div class="splash-title">Sistema de Gestión</div>
        <div class="splash-subtitle">
          Iniciando sistema
          <span class="splash-dots">
            <span></span><span></span><span></span>
          </span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
