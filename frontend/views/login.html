<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SISTEMA DE SERVICIO TÉCNICO — Login</title>
    <link href="../styles/style.css" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body
    class="bg-gradient d-flex align-items-center justify-content-center vh-100"
  >
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-sm-10 col-md-8 col-lg-5 col-xl-4">
          <div class="auth-card card border-0 rounded-4 shadow-lg p-4 p-md-5">
            <div class="card-body">
              <div class="text-center mb-4">
                <h1 class="h3 fw-bold text-primary mb-1">
                  SISTEMA DE SERVICIO TÉCNICO
                </h1>
                <p class="text-muted mb-0">Gestión de recepciones</p>
              </div>

              <div id="alert-area" class="mb-4"></div>

              <form id="login-form">
                <div class="mb-3">
                  <label for="username" class="form-label visually-hidden"
                    >Usuario</label
                  >
                  <input
                    id="username"
                    name="username"
                    class="form-control form-control-lg"
                    placeholder="Usuario"
                    required
                    autofocus
                  />
                </div>

                <div class="mb-3 position-relative">
                  <label for="password" class="form-label visually-hidden"
                    >Contraseña</label
                  >
                  <div class="input-group input-group-lg">
                    <input
                      id="password"
                      name="password"
                      type="password"
                      class="form-control"
                      placeholder="Contraseña"
                      required
                    />
                    <button
                      id="toggle-pass"
                      type="button"
                      class="btn btn-outline-secondary"
                      title="Mostrar contraseña"
                    >
                      <svg
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                      >
                        <path
                          d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"
                        ></path>
                        <circle cx="12" cy="12" r="3"></circle>
                      </svg>
                    </button>
                  </div>
                </div>

                <div
                  class="d-flex justify-content-between align-items-center mb-3"
                >
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      value=""
                      id="remember-me"
                    />
                    <label
                      class="form-check-label small text-muted"
                      for="remember-me"
                      >Mantener sesión iniciada</label
                    >
                  </div>
                  <a
                    href="#"
                    id="forgot-password-link"
                    class="small text-decoration-none"
                    >¿Olvidaste tu contraseña?</a
                  >
                </div>

                <button
                  id="btn-login"
                  type="submit"
                  class="btn btn-primary btn-lg w-100"
                >
                  Iniciar Sesión
                </button>
              </form>
              <div class="text-center mt-3">
                <span class="text-muted small">¿No tienes cuenta?</span>
                <a href="register.html" class="small text-decoration-none"
                  >Crear cuenta</a
                >
              </div>
            </div>
          </div>
          <div class="text-center mt-4 text-muted small">© APP-TALLER</div>
        </div>
      </div>
    </div>

    <!-- Forgot Password Modal -->
    <div
      class="modal fade"
      id="forgotPasswordModal"
      tabindex="-1"
      aria-labelledby="forgotPasswordModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 shadow">
          <div
            class="modal-header bg-primary text-white border-0 rounded-top-4"
          >
            <h5 class="modal-title fw-bold" id="forgotPasswordModalLabel">
              Recuperar Contraseña
            </h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body p-4">
            <div id="forgot-password-alert-area" class="mb-3"></div>
            <p class="text-muted small mb-4">
              Introduce tu nombre de usuario. Te asignaremos una contraseña
              temporal que podrás cambiar al iniciar sesión.
            </p>
            <form id="forgot-password-form">
              <div class="mb-3">
                <label for="fp-username" class="form-label visually-hidden"
                  >Usuario</label
                >
                <input
                  type="text"
                  class="form-control form-control-lg"
                  id="fp-username"
                  placeholder="Usuario"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="fp-new-password" class="form-label visually-hidden"
                  >Nueva Contraseña</label
                >
                <input
                  type="password"
                  class="form-control form-control-lg"
                  id="fp-new-password"
                  placeholder="Nueva Contraseña"
                  required
                  minlength="4"
                />
              </div>
              <div class="mb-4">
                <label
                  for="fp-confirm-password"
                  class="form-label visually-hidden"
                  >Confirmar Contraseña</label
                >
                <input
                  type="password"
                  class="form-control form-control-lg"
                  id="fp-confirm-password"
                  placeholder="Confirmar Contraseña"
                  required
                  minlength="4"
                />
              </div>
              <button
                type="submit"
                class="btn btn-primary btn-lg w-100"
                id="fp-submit-btn"
              >
                Restablecer Contraseña
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../scripts/login.js"></script>
  </body>
</html>
