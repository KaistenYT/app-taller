services:
  db:
    image: postgres:15-alpine
    container_name: taller-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
      POSTGRES_DB: ${DB_NAME:-TALLER_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: taller-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: taller-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password123}
      DB_NAME: ${DB_NAME:-TALLER_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-super-secret-key-32-chars-long-min}
      CORS_ORIGIN: http://localhost:8080
    depends_on:
      - db
      - redis
    ports:
      - "3001:3001"

  frontend:
    build: 
      context: .
      dockerfile: frontend/react/app-taller/Dockerfile
      args:
        VITE_API_URL: http://localhost:3001/api
    container_name: taller-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
